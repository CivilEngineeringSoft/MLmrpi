[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mlmrpi"
version = "1.1.0"
description = "MLmrpi: Machine Learning Multi-Response Performance Index for ranking ML models from precomputed performance metrics (AW, DEAR, GRA, FA, MRNV)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Paterne Cirhuza Badesire et al."}]
keywords = ["machine learning", "model evaluation", "model ranking", "multi-criteria decision making",
            "grey relational analysis", "multi-response optimization", "performance index", "regression"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["numpy>=1.21", "pandas>=1.3", "scipy>=1.7", "matplotlib>=3.5"]

[project.optional-dependencies]
excel = ["openpyxl>=3.0"]
dev = ["pytest>=7", "openpyxl>=3.0"]

[project.urls]
Homepage = "https://github.com/CivilEngineeringSoft/MLmrpi"
Issues = "https://github.com/CivilEngineeringSoft/MLmrpi/issues"

[project.scripts]
mlmrpi = "mlmrpi.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"mlmrpi.data" = ["*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
